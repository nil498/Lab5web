
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai Akhir</title>

</head>

<body>

    <div class="container">
        <h2>Kalkulator Nilai Akhir</h2>

        <form id="formNilai">
            <label for="tugas">Nilai Tugas:</label>
            <input type="number" id="tugas"
                   min="0" max="100" required>

            <label for="uts">Nilai UTS:</label>
            <input type="number" id="uts"
                   min="0" max="100" required>

            <label for="uas">Nilai UAS:</label>
            <input type="number" id="uas"
                   min="0" max="100" required>

            <button type="submit">Hitung Nilai</button>
        </form>

        <p id="pesan"></p>

        <div id="hasil" hidden>
            <h3>Hasil Perhitungan</h3>
            <p id="nilaiAkhir"></p>
            <p id="predikat"></p>
            <p id="status"></p>
        </div>
    </div>

    <script>
        // Fungsi menghitung nilai akhir
        function hitungNilaiAkhir(tugas, uts, uas) {
            return tugas * 0.30 + uts * 0.30 + uas * 0.40;
        }

        // Fungsi menentukan predikat
        function tentukanPredikat(nilai) {
            if (nilai >= 85) return "A";
            if (nilai >= 75) return "B";
            if (nilai >= 60) return "C";
            if (nilai >= 50) return "D";
            return "E";
        }

        // Fungsi menentukan status kelulusan
        function tentukanStatus(nilai) {
            return nilai >= 60 ? "Lulus" : "Belum lulus";
        }

        // Fungsi menampilkan hasil ke halaman HTML
        function tampilkanHasil(nilai) {
            document.getElementById("hasil").hidden = false;

            document.getElementById("nilaiAkhir").textContent =
                "Nilai akhir: " + nilai.toFixed(2);

            document.getElementById("predikat").textContent =
                "Predikat: " + tentukanPredikat(nilai);

            document.getElementById("status").textContent =
                "Status: " + tentukanStatus(nilai);
        }

        // Proses ketika tombol diklik
        document.getElementById("formNilai").addEventListener(
            "submit", function(event) {
                event.preventDefault();

                const tugas = Number(
                    document.getElementById("tugas").value
                );
                const uts = Number(
                    document.getElementById("uts").value
                );
                const uas = Number(
                    document.getElementById("uas").value
                );

                const pesan = document.getElementById("pesan");
                const hasil = document.getElementById("hasil");

                pesan.textContent = "";
                hasil.hidden = true;

                // Validasi nilai 0 sampai 100
                if (
                    !Number.isFinite(tugas) ||
                    !Number.isFinite(uts) ||
                    !Number.isFinite(uas) ||
                    tugas < 0 || tugas > 100 ||
                    uts < 0 || uts > 100 ||
                    uas < 0 || uas > 100
                ) {
                    pesan.textContent =
                        "Semua nilai harus berada pada rentang 0–100.";
                    return;
                }

                const akhir = hitungNilaiAkhir(tugas, uts, uas);

                tampilkanHasil(akhir);
            }
        );
    </script>

</body>
</html>
